name: Go Build & Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 1.24
      - name: Run tests
        run: go test ./...
      - name: Build CLI
        run: go build -o gitglimpse ./src/cmd/gitglimpse
