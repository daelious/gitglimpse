name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Crucial: GoReleaser needs the full git history for tags

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24

      # Runs the GoReleaser engine which reads your .goreleaser.yaml file
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}